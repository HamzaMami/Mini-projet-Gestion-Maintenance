steps:
  # 1. Build Backend JAR using Maven
  - name: 'maven:3.8.4-openjdk-17'
    entrypoint: 'mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'backend'
  
  # 2. Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/maintenix-backend', './backend']
  
  # 3. Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/maintenix-frontend', './frontend']

  # 4. Push Images to Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/maintenix-backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/maintenix-frontend']

images:
  - 'gcr.io/$PROJECT_ID/maintenix-backend'
  - 'gcr.io/$PROJECT_ID/maintenix-frontend'
