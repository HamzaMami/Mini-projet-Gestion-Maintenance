spring.application.name=maintenance-app

# Import optional secrets file (place sensitive values in ../secrets.properties)
spring.config.import=optional:file:./secrets.properties

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/maintenance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Explicitly set the dialect to avoid "determine Dialect" errors
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Port
server.port=8080