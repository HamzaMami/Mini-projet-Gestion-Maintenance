spring.application.name=maintenance-app

# Import optional secrets file (place sensitive values in ../secrets.properties)
spring.config.import=optional:file:./secrets.properties

# MySQL Database (URL kept here; username/password moved to secrets.properties)
spring.datasource.url=jdbc:mysql://localhost:3306/maintenance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Let Hibernate auto-detect the dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Port
server.port=8080