version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: maintenance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: maintenance_db
      MYSQL_USER: jeeuser
      MYSQL_PASSWORD: n2N1((J]-tNuySJ9
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: maintenance-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/maintenance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USER=jeeuser
      - DB_PASSWORD=n2N1((J]-tNuySJ9
      - PORT=8080
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: maintenance-frontend
    ports:
      - "80:80"
    environment:
      - PORT=80
    depends_on:
      - backend

volumes:
  mysql_data:
